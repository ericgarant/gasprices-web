name: Price history snapshot

on:
  schedule:
    - cron: '17 * * * *' # every hour at :17 (UTC), off the busy top of the hour
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Save snapshot
        run: node scripts/snapshot.mjs
      - name: Commit if prices changed
        run: |
          git config user.name "price-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: price snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
