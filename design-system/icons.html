<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Plein · Icons</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<style>
body{font-family:var(--font-body);background:var(--bg);color:var(--on-surface);padding:40px 24px;max-width:960px;margin:0 auto}
.lede{color:var(--muted);margin:10px 0 20px;line-height:1.55}
.ctl{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px;font:600 13px var(--font-body);color:var(--muted)}
.grid-i{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.it{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.it .nm{font:11px var(--font-mono);color:var(--subtle)}
</style>
</head>
<body>

<h1 class="t-h2" style="margin-top:16px">Icon set</h1>
<p class="lede">Token-driven: change <code>--icon-stroke</code> or <code>--icon-size</code> in <code>styles.css</code> to reskin every icon.</p>
<div class="ctl"><label>stroke <input type="range" min="1" max="3" step="0.1" value="2" oninput="document.documentElement.style.setProperty('--icon-stroke',this.value)"></label>
<label>size <input type="range" min="16" max="40" step="2" value="28" oninput="document.documentElement.style.setProperty('--icon-large',this.value+'px')"></label>
<select id="themeSel" aria-label="Theme"><option value="">Jour</option><option value="dark">Nuit</option></select></div>
<div class="grid-i" id="grid"></div>
<script>grid.innerHTML=[...document.querySelectorAll('symbol')].map(s=>`<div class="it"><svg class="ico ico--lg"><use href="#${s.id}"/></svg><div class="nm">${s.id}</div></div>`).join('');</script>
